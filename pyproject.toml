[tool.poetry]
name = "frame-semantic-transformer"
version = "1.1.0"
description = "Frame Semantic Parser based on T5 and FrameNet"
license = "MIT"
readme = "README.md"
repository = "https://github.com/chanind/frame-semantic-transformer"
authors = ["David Chanin <chanindav@gmail.com>"]

[tool.poetry.dependencies]
# transformers 5 requires Python >= 3.10
python = "^3.10"
nltk = "^3.7"
# 5.3 is where clean_up_tokenization returned after being dropped in 5.0
transformers = "^5.3.0"
# pytorch-lightning 2.x is the first series supporting the torch >= 2.4 that
# transformers 5 needs in order to enable its PyTorch model classes at all
pytorch-lightning = "^2.5"
tqdm = "^4.64.0"
# 0.1.x publishes no wheels past CPython 3.11
sentencepiece = "^0.2.0"
protobuf = "^5.29"
nlpaug = "^1.1.11"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
black = "^26.5"
mypy = "^1.18"
flake8 = "^7.3"
syrupy = "^4.6"
pygments = "^2.14.0"
furo = "^2022.12.7"
torch = "^2.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
version_variables = [
    "frame_semantic_transformer/__init__.py:__version__",
    "pyproject.toml:version",
]
build_command = "pip install poetry && poetry build"
